<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أوانا الشرق الأوسط</title>
<meta name="theme-color" content="#0057a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أوانا">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<style>
img{max-width:100%}
/* Layout: blue Awana band + colored tab dots, one working column (max 1120px); the four Awana colors carry stats, tabs, programs and cards */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --raise:#eef2f8; --ink:#0f1a2c; --muted:#58657c; --line:#dde3ee;
  --brand:#0057a8; --brand-deep:#003f7d;
  --blue:#0057a8; --red:#e0262d; --green:#3f9b2c; --yellow:#f7b500; --sky:#5ea8f0;
  --on-blue:#ffffff; --on-red:#ffffff; --on-green:#ffffff; --on-yellow:#231900;
  --blue-soft:#e2edfb; --red-soft:#fde5e5; --green-soft:#e4f3de; --yellow-soft:#fff2cc;
  --accent:#0057a8; --accent-ink:#ffffff;
  --shadow:0 1px 2px rgba(8,30,70,.06),0 10px 28px -16px rgba(8,30,70,.28);
  --f-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:16px;--blob:9%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090e18; --surface:#111a2a; --raise:#172338; --ink:#e9eff9; --muted:#95a4bd; --line:#223049;
  --brand:#0b3a76; --brand-deep:#072a57;
  --blue:#2f86e0; --red:#ef4a4f; --green:#4cb238; --yellow:#ffc21c; --sky:#7cbcff;
  --on-yellow:#231900;
  --blue-soft:#12294b; --red-soft:#3a1719; --green-soft:#15301a; --yellow-soft:#382c0b;
  --accent:#5ea8f0; --accent-ink:#06182f;--blob:13%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090e18; --surface:#111a2a; --raise:#172338; --ink:#e9eff9; --muted:#95a4bd; --line:#223049;
  --brand:#0b3a76; --brand-deep:#072a57;
  --blue:#2f86e0; --red:#ef4a4f; --green:#4cb238; --yellow:#ffc21c; --sky:#7cbcff;
  --on-yellow:#231900;
  --blue-soft:#12294b; --red-soft:#3a1719; --green-soft:#15301a; --yellow-soft:#382c0b;
  --accent:#5ea8f0; --accent-ink:#06182f;--blob:13%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(520px 420px at 100% 12%,color-mix(in srgb,var(--blue) var(--blob),transparent),transparent 70%),
 radial-gradient(460px 380px at 0% 38%,color-mix(in srgb,var(--red) var(--blob),transparent),transparent 70%),
 radial-gradient(520px 420px at 100% 72%,color-mix(in srgb,var(--green) var(--blob),transparent),transparent 70%),
 radial-gradient(460px 380px at 0% 100%,color-mix(in srgb,var(--yellow) var(--blob),transparent),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff;overflow:hidden}
.top::before{content:"";position:absolute;inset-inline-end:-120px;top:-210px;width:520px;height:300px;border-radius:50%;border:2px solid rgba(255,255,255,.14);pointer-events:none}
.top::after{content:"";position:absolute;inset-inline-end:-60px;top:-170px;width:420px;height:240px;border-radius:50%;border:2px solid rgba(255,255,255,.08);pointer-events:none}
.top-in{position:relative;max-width:1120px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
.brand-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{height:34px;width:auto;flex:none;display:block}
.brand .sep{width:2px;height:32px;border-radius:2px;background:var(--yellow);flex:none}
.brand .ttl{min-width:0}
.brand h1{font-size:1.35rem;color:#fff;white-space:nowrap;line-height:1.1}
.brand small{display:block;color:rgba(255,255,255,.75);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.ibtn{border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;height:36px;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem;font-weight:600;white-space:nowrap}
.ibtn:hover{background:rgba(255,255,255,.16);border-color:#fff}
.ibtn.on{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.ibtn.install{background:#fff;color:var(--brand);border-color:#fff}
.ibtn svg{width:17px;height:17px;flex:none}
.ibtn .short{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px 8px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:rgba(255,255,255,.82);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-size:.92rem}
.tab i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab[aria-selected="true"]{background:var(--tabc,#fff);color:var(--tabi,var(--brand-deep));box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.tab[aria-selected="true"] i{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.top :focus-visible{outline-color:var(--yellow)}
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:6px}
.stripe i:nth-child(1){background:var(--blue)}.stripe i:nth-child(2){background:var(--red)}.stripe i:nth-child(3){background:var(--green)}.stripe i:nth-child(4){background:var(--yellow)}
.top .stripe i:nth-child(1){background:var(--sky)}
@media (max-width:760px){
  .top-in{gap:6px;padding-block:10px 0}
  .brand{flex-direction:column;align-items:flex-start;gap:2px}
  .logo{height:24px}.brand .sep{display:none}
  .brand h1{font-size:.95rem}
  .brand small{display:none}
  .tools{gap:5px}
  .ibtn{width:36px;padding:0}.ibtn .lbl{display:none}.ibtn .short{display:inline}
  .tabs{margin-inline:-6px;padding-inline:6px}
  .tab{padding:7px 12px;font-size:.88rem}
}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:flex;flex-direction:column;gap:24px}
.viewbar{background:var(--yellow-soft);border-radius:12px;padding:9px 14px;font-size:.88rem;display:flex;gap:8px;align-items:center;font-weight:500}
.viewbar svg{width:16px;height:16px;flex:none}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.65rem}
.sec-head h2.sm{font-size:1.3rem}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.dots{display:inline-flex;gap:4px;margin-inline-end:8px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%}
.dots i:nth-child(1){background:var(--blue)}.dots i:nth-child(2){background:var(--red)}.dots i:nth-child(3){background:var(--green)}.dots i:nth-child(4){background:var(--yellow)}

.btn{text-decoration:none;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--on-blue);display:inline-flex;gap:7px;align-items:center;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--blue) 70%,transparent)}
.btn:hover{filter:brightness(1.07)}
.btn svg{width:17px;height:17px}
.btn.red{background:var(--red);color:var(--on-red);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--red) 70%,transparent)}
.btn.green{background:var(--green);color:var(--on-green);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--green) 70%,transparent)}
.btn.yellow{background:var(--yellow);color:var(--on-yellow);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--yellow) 70%,transparent)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:700}

/* ---------- auth gate ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--brand);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.gate .arcs{position:absolute;inset-inline-end:-90px;bottom:-200px;width:420px;height:420px;z-index:-1;pointer-events:none}
.gate .arcs span{position:absolute;inset:0;border-radius:50%;border:20px solid;border-color:currentColor transparent transparent currentColor;transform:rotate(45deg)}
.gate .arcs span:nth-child(1){color:var(--yellow)}.gate .arcs span:nth-child(2){inset:28px;color:var(--green)}.gate .arcs span:nth-child(3){inset:56px;color:var(--red)}.gate .arcs span:nth-child(4){inset:84px;color:var(--sky)}
@media (max-width:640px){.gate .arcs{width:300px;height:300px;bottom:-200px;inset-inline-end:-80px}.gate .arcs span{border-width:15px}.gate .arcs span:nth-child(2){inset:20px}.gate .arcs span:nth-child(3){inset:40px}.gate .arcs span:nth-child(4){inset:60px}}
.gate .box{max-width:430px;width:100%;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.gate .logo{height:52px}
.gate h1{font-size:2.1rem;line-height:1.2}
.gate p{margin:0;opacity:.92;line-height:1.7}
.gate .card{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.gate .stripe{width:110px;border-radius:4px;overflow:hidden}
.gate .stripe i:nth-child(1){background:var(--sky)}
.gate .err{color:#ffd6d6;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 12px;font-size:.88rem}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:999px;padding:13px 24px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);min-width:240px}
.gbtn svg{width:20px;height:20px}
.gbtn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);box-shadow:none;min-width:0;padding:9px 18px;font-size:.9rem}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:var(--yellow);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ibtn.me{padding:0;width:36px;overflow:hidden}
@media (max-width:760px){#btnLang,#btnTheme,#btnView{display:none}}
.ibtn.me img{width:100%;height:100%;object-fit:cover}
/* users */
.ucard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.ucard.pending{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow-soft)}
.ucard .hd{display:flex;gap:12px;align-items:center;min-width:0}
.ucard .hd img,.ucard .hd .av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover}
.ucard .hd div{min-width:0}
.ucard .hd small{display:block;color:var(--muted);word-break:break-all;font-size:.82rem}
.ucard .ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ucard select{border:1.5px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.rolechip{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.r-pending{background:var(--yellow);color:var(--on-yellow)}.r-admin{background:var(--blue);color:var(--on-blue)}.r-leader{background:var(--green);color:var(--on-green)}.r-viewer{background:var(--raise);color:var(--ink)}.r-disabled{background:var(--red);color:var(--on-red)}
.tab .cnt{background:var(--yellow);color:var(--on-yellow);border-radius:999px;font-size:.72rem;padding:0 7px;line-height:1.6}
.pgroup{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pgroup .rn{display:flex;align-items:center;gap:6px;font-weight:700}
span.chip{cursor:default;display:inline-flex;align-items:center;gap:4px}
.x{border:0;background:none;color:var(--red);cursor:pointer;padding:0 4px;font-weight:700;font-size:1.05rem;line-height:1;border-radius:6px}
.x.armed{background:var(--red);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:999px}
.chip .x{border:0;background:none;color:var(--red);cursor:pointer;padding:0 2px;font-weight:700;font-size:1rem;line-height:1}
.chip .x.armed{background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 7px}
.ucards{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.vt td.kids{white-space:nowrap}
@media (max-width:640px){.tbl-wrap:has(.vt){border:0;background:none;overflow:visible}.vt,.vt tbody{display:block}.vt thead{display:none}.vt tr{display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-inline-start:6px solid var(--tc);border-radius:14px;margin-bottom:10px;padding:8px 0}.vt td{border:0;padding:4px 14px}.vt td:first-child,.vt td:last-child{grid-column:1/-1}.vt tr.h{display:block;margin-top:-14px;border-top:0;border-radius:0 0 14px 14px}.vt tr.h td{padding:0}}
.wa{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#25d366;color:#fff;vertical-align:middle;text-decoration:none;flex:none}
.wa:hover{filter:brightness(1.08)}
.club.paused{opacity:.6}
.rpt{display:flex;flex-direction:column;gap:12px}
.rpt h4{margin:0 0 3px;font-size:.85rem;color:var(--accent)}
.rpt p{margin:0;white-space:pre-wrap;line-height:1.75}
.prow{display:flex;justify-content:space-between;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem;flex-wrap:wrap;align-items:center}
.prow>span:first-child{flex:1 1 220px}
.pact{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qsel{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}
.bell{position:relative}
.bell .dot{position:absolute;top:-3px;inset-inline-end:-3px;background:var(--red);color:#fff;border-radius:999px;font-size:.66rem;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700;border:2px solid var(--brand)}
.alrow{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--raise);cursor:pointer;border:0;width:100%;text-align:start}
.alrow:hover{filter:brightness(.97)}
.logrow{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.86rem;align-items:baseline;flex-wrap:wrap}
.logrow time{color:var(--muted);font-size:.78rem;white-space:nowrap}
.bkbar{background:var(--yellow);color:var(--on-yellow);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--brand);color:#fff;padding:28px 26px 26px;display:grid;gap:14px;isolation:isolate}
.hero .arcs{position:absolute;inset-inline-end:-70px;bottom:-150px;width:340px;height:340px;z-index:-1;pointer-events:none}
.hero .arcs span{position:absolute;inset:0;border-radius:50%;border:16px solid;border-color:currentColor transparent transparent currentColor;transform:rotate(45deg)}
[dir="rtl"] .hero .arcs span{transform:rotate(-45deg) scaleX(-1)}
.hero .arcs span:nth-child(1){color:var(--yellow)}
.hero .arcs span:nth-child(2){inset:22px;color:var(--green)}
.hero .arcs span:nth-child(3){inset:44px;color:var(--red)}
.hero .arcs span:nth-child(4){inset:66px;color:var(--sky)}
@media (max-width:640px){.hero{padding:22px 20px 70px}.hero .arcs{width:190px;height:190px;bottom:-105px;inset-inline-end:-40px}.hero .arcs span{border-width:11px}.hero .arcs span:nth-child(2){inset:15px}.hero .arcs span:nth-child(3){inset:30px}.hero .arcs span:nth-child(4){inset:45px}}
.hero .eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--yellow);text-transform:uppercase}
.hero p{margin:0;font-family:var(--f-display);font-size:clamp(1.35rem,4vw,2.1rem);line-height:1.6;max-width:30ch;text-wrap:balance}
[lang="en"] .hero p{line-height:1.35}
.hero p b{font-weight:400;color:var(--yellow)}
.hero cite{font-style:normal;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.9)}
.hero cite .stripe{width:72px;height:6px;border-radius:4px;overflow:hidden}
.hero cite .stripe i:nth-child(1){background:var(--sky)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .ring-tile{grid-column:1/-1}}
.tile{position:relative;overflow:hidden;border-radius:var(--r);padding:16px 16px 14px;color:#fff;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
.tile::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;inset-inline-end:-34px;top:-40px;background:rgba(255,255,255,.16);z-index:-1}
.tile b{font-family:var(--f-display);font-weight:400;font-size:2.4rem;line-height:1}
.tile span{font-weight:700;font-size:.9rem;opacity:.95}
.tile.blue{background:var(--blue);color:var(--on-blue)}
.tile.red{background:var(--red);color:var(--on-red)}
.tile.green{background:var(--green);color:var(--on-green)}
.tile.yellow{background:var(--yellow);color:var(--on-yellow)}
.tile.yellow::after{background:rgba(255,255,255,.35)}
.ring-tile{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center}
.ring{width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--raise) 0)}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.ring-tile strong{display:block;font-weight:700}
.ring-tile small{color:var(--muted)}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.panel[data-c]{--pc:var(--blue);--ps:var(--blue-soft);border-color:color-mix(in srgb,var(--pc) 32%,var(--line));background:linear-gradient(180deg,var(--ps) 0,var(--surface) 150px);border-top:6px solid var(--pc)}
.panel[data-c="1"]{--pc:var(--red);--ps:var(--red-soft)}.panel[data-c="2"]{--pc:var(--green);--ps:var(--green-soft)}.panel[data-c="3"]{--pc:var(--yellow);--ps:var(--yellow-soft)}
.panel[data-c] h2.sm{color:color-mix(in srgb,var(--pc) 70%,var(--ink))}
.panel[data-c="3"] h2.sm{color:color-mix(in srgb,var(--pc) 45%,var(--ink))}
main{--tc:var(--blue)}

/* programs */
.pbars{display:flex;flex-direction:column;gap:14px}

/* tables */

table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.76rem;color:var(--muted);font-weight:700;text-align:start;padding:11px 12px;background:var(--raise);white-space:nowrap}

tr.click{cursor:pointer}
tr.click:hover td{background:var(--raise)}
.bar{height:8px;border-radius:9px;background:var(--raise);overflow:hidden;flex:1}

.prog{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}

.st.no{background:var(--red-soft);color:var(--red)}

/* country cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.flagbox{display:inline-block;aspect-ratio:3/2;width:56px;border-radius:8px;overflow:hidden;flex:none;background:var(--raise);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 10px -4px rgba(0,0,0,.35);vertical-align:middle;max-width:100%}
.flagbox img,.flagbox svg{width:100%;height:100%;object-fit:cover;display:block}
.flagbox.nf img{display:none}
.flagbox.nf{display:inline-grid;place-items:center;background:var(--blue);color:#fff;font-family:var(--f-display)}
.flagbox.nf::after{content:attr(data-i);font-size:1.6em}
.flagbox.gulf{display:inline-grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2px;background:#fff;padding:2px}

.flagbox.sm{width:26px;border-radius:4px}

.flagwall button{border:0;background:var(--surface);border-radius:16px;padding:12px 10px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);border-bottom:5px solid var(--cc,var(--blue));transition:transform .15s}

.cband .flagrow{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ccard{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s}

.ccard .hd{display:flex;gap:12px;align-items:center}
.badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;flex:none}
.c0{background:var(--blue);color:var(--on-blue)}.c1{background:var(--red);color:var(--on-red)}.c2{background:var(--green);color:var(--on-green)}.c3{background:var(--yellow);color:var(--on-yellow)}
.ccard h3{font-size:1.3rem}
.ccard .mg{font-size:.84rem;color:var(--muted)}
.ccard .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--raise);border-radius:12px;padding:8px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.85rem;font-weight:700}

.cband{border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;isolation:isolate}

.cband .icon{color:inherit}.cband .icon:hover{background:rgba(255,255,255,.2);color:inherit}

.club{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto auto;gap:10px;padding:11px 16px;align-items:center;border-top:1px solid var(--line);font-size:.9rem}

.kids{white-space:nowrap}.kids b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
@media (max-width:640px){.club{grid-template-columns:1fr auto;grid-template-areas:"p k" "w s";row-gap:6px}.club>:nth-child(1){grid-area:p}.club>:nth-child(2){grid-area:w}.club>:nth-child(3){grid-area:k;justify-self:end}.club>:nth-child(4){grid-area:s;justify-self:end}}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 11px;min-width:0}
.filters input{flex:1 1 180px}

/* stories */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.story{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;text-align:start;display:flex;flex-direction:column;padding:0;transition:transform .15s,box-shadow .15s}

.story .ph{aspect-ratio:16/10;max-width:100%;background:var(--raise) center/cover no-repeat;position:relative;display:grid;place-items:center}
.story .ph.c0,.story .ph.c1,.story .ph.c2,.story .ph.c3{font-family:var(--f-display);font-size:5rem;line-height:1}
.story .ph.c0{background:var(--blue)}.story .ph.c1{background:var(--red)}.story .ph.c2{background:var(--green)}.story .ph.c3{background:var(--yellow)}
.story .ph .tag{position:absolute;top:10px;inset-inline-start:10px;font-family:var(--f-body);font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#0f1a2c}
.story .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.story h3{font-size:1.25rem}
.story p{margin:0;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story small{color:var(--muted);font-size:.78rem;font-weight:600}
.sview{display:flex;flex-direction:column;gap:14px}
.sview .photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.sview .photos div{aspect-ratio:4/3;max-width:100%;border-radius:12px;background:var(--raise) center/cover no-repeat}
.sview .txt{white-space:pre-wrap;line-height:1.85;font-size:1rem}
.sview .meta{color:var(--muted);font-size:.85rem;font-weight:600}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border:2px dashed var(--line);border-radius:14px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--raise) center/cover no-repeat;cursor:pointer;color:var(--muted);font-weight:700;font-size:.85rem;text-align:center;padding:6px}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot.has{border-style:solid;color:transparent}
.slot .rm{position:absolute;top:6px;inset-inline-end:6px;z-index:2;background:var(--red);color:#fff;border:0;border-radius:999px;width:28px;height:28px;cursor:pointer;display:grid;place-items:center}
.slot .rm svg{width:15px;height:15px}

/* team */
.person{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:start}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.2rem;flex:none}
.person .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.person b{font-size:1rem}
.person .role{font-weight:700;font-size:.83rem}
.person .meta{font-size:.83rem;color:var(--muted);display:flex;flex-direction:column}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:30px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:1.3rem}

.acts{display:flex;gap:4px}
.icon{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:9px;display:inline-grid;place-items:center}
.icon:hover{background:var(--raise);color:var(--ink)}
.icon svg{width:18px;height:18px}
.icon.armed{background:var(--red);color:#fff!important;font-size:.78rem;font-weight:700;padding:5px 9px}

.vhist{padding:6px 16px 12px;font-size:.84rem;display:flex;flex-direction:column;gap:4px;background:var(--raise)}
.vhist div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,14,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}

.sheet-top{position:sticky;top:0;background:var(--surface);z-index:2;margin-inline:-18px;padding:0 18px}

.sheet h2{font-size:1.5rem;padding-top:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.8rem;font-weight:700;color:var(--muted)}

.clubrow{display:grid;grid-template-columns:1.1fr 1.2fr 1.1fr .6fr .9fr auto;gap:6px;align-items:end;padding:10px;border-radius:12px;background:var(--raise)}
.clubrow .f input,.clubrow .f select{background:var(--surface)}

.sheet-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:12px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-inline:-18px;padding-inline:18px}
.err{color:var(--red);font-size:.85rem;font-weight:600;min-height:1em}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:start;background:var(--raise);border-radius:14px;padding:12px 14px}

.menu{position:absolute;inset-inline-end:16px;top:56px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:240px;z-index:30}

.menuHost{position:fixed;inset:0;z-index:25}
.loading{color:var(--muted);text-align:center;padding:40px}

.foot{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 30px;color:var(--muted);font-size:.82rem;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

<script>

  Object.values(byClub).forEach(a=>a.sort((a,b)=>a.date.localeCompare(b.date)));
  const cq=curQ();
  return qs.map(q=>{const end=qEnd(q);let tot=0;clubs.filter(active).forEach(c=>{const a=byClub[c.id];

function lineChart(series,color){

  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`;
  const grid=[0,.5,1].map(f=>{const yy=pt+(H-pt-pb)*f;return `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`}).join("");
  return `<div dir="ltr" style="width:100%;overflow:hidden"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("growth"))}" style="display:block;max-width:100%">${grid}
   <path d="${area}" fill="${color}" fill-opacity=".14"/><path d="${line}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

async function compressImage(file){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  let max=1200,q=.8,out="";
  for(let k=0;k<7;k++){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<220000)return out;max*=.8;q=Math.max(.5,q-.06)}
  return out;
}

async function backupNow(){
  toast(t("preparing"));
  try{
    const out={app:"awana-me",version:1,at:Date.now(),by:S.me.email,data:{}};
    for(const n of COLS.concat(["storyImages","users","config","logs"])){const sn=await db.collection(n).get();out.data[n]=sn.docs.map(x=>Object.assign({id:x.id},x.data()))}
    await save(`awana-backup-${today()}.json`,new Blob([JSON.stringify(out)],{type:"application/json"}));
    await db.doc("config/backup").set({at:Date.now(),by:S.me.email||""});
  }catch(e){console.error(e);toast(t("failed"))}
}
async function restorePick(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast(t("badBackup"));return}
  if(!data||data.app!=="awana-me"||!data.data){toast(t("badBackup"));return}
  const counts=Object.entries(data.data).filter(([k,v])=>/^[A-Za-z]+$/.test(k)&&k!=="logs"&&Array.isArray(v));
  openModal(t("restoreTitle"),`<p style="margin:0">${esc(t("restoreWarn"))}</p><div class="panel" style="padding:12px 14px"><b>${esc(file.name)}</b><div class="muted num" style="font-size:.85rem">${fmtDate(new Date(data.at).toISOString().slice(0,10))} · ${counts.map(([k,v])=>`${esc(k)}: ${nf(v.length)}`).join(" · ")}</div></div>`,async f=>{
    $("msave").textContent=t("restoring");
    let batch=db.batch(),n=0,bytes=0;
    for(const [col,rows] of counts){for(const row of rows){if(!row||!row.id||/[\/]/.test(row.id))continue;const {id,...rest}=row;const sz=JSON.stringify(rest).length;
      if(n>=400||bytes+sz>8e6){await batch.commit();batch=db.batch();n=0;bytes=0}
      batch.set(db.doc(col+"/"+id),rest);n++;bytes+=sz}}
    if(n)await batch.commit();
    logAct("add","restore",file.name,"");
  });
  $("msave").textContent=t("restoreGo");
}

function renderGate(){
  const r=document.documentElement;r.lang=S.lang;r.dir=S.lang==="ar"?"rtl":"ltr";
  if(S.theme)r.setAttribute("data-theme",S.theme);else r.removeAttribute("data-theme");

  const verse=`<p style="font-size:.88rem;opacity:.8">«${esc(t("verse").replace(/<\/?b>/g,""))}» — ${esc(t("verseRef"))}</p>`;
  const out=`<button class="gbtn ghost" type="button" data-signout="1">${esc(t("signOut"))}</button>`;
  const who=S.me&&S.me.email?`<p style="font-size:.85rem;opacity:.8">${esc(t("signedAs"))} <span class="ltr">${esc(S.me.email)}</span></p>`:"";
  let inner;

    case"nocfg":inner=`${top}<div class="card"><b>${esc(t("nocfgTitle"))}</b><p>${esc(t("nocfgText"))}</p></div>`;break;
    case"loading":inner=`${top}<div class="spin" role="status" aria-label="…"></div>`;break;

    case"pending":inner=`${top}<div class="card"><b style="font-size:1.15rem">${esc(t("pendingTitle"))}</b><p>${esc(t("pendingText"))}</p>${who}</div>${out}`;break;
    case"disabled":inner=`${top}<div class="card"><b style="font-size:1.15rem">${esc(t("disabledTitle"))}</b><p>${esc(t("disabledText"))}</p>${who}</div>${out}`;break;
    default:inner=`${top}<div class="card"><b>${esc(t("authFail"))}</b>${S.authErr?`<small class="ltr">${esc(S.authErr)}</small>`:""}</div>${out}`;

let toastT;function toast(msg){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
function openModal(title,body,onSave,extra){
  const root=$("modalRoot");
  root.innerHTML=`<div class="ov" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-top"><div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div><h2>${esc(title)}</h2></div><form id="mform" novalidate style="display:flex;flex-direction:column;gap:14px">${body}<div class="err" id="merr"></div><div class="sheet-foot">${extra||""}<span style="flex:1"></span><button type="button" class="btn ghost" data-close="1">${esc(onSave?t("cancel"):t("close"))}</button>${onSave?`<button type="submit" class="btn" id="msave">${esc(t("save"))}</button>`:""}</div></form></div></div>`;
  const form=$("mform");
  root.querySelector(".ov").addEventListener("click",e=>{if(e.target.dataset.close)closeModal()});
  form.addEventListener("submit",async e=>{e.preventDefault();if(!onSave)return;const b=$("msave");b.disabled=true;
    try{const r=await onSave(form);if(r===false){b.disabled=false;b.textContent=t("save");return}closeModal();toast(t("saved"))}
    catch(err){console.error(err);merr(err&&err.code==="invalid_argument"?t("noPerm"):err&&err.code==="quota_exceeded"?err.message:t("failed"));b.disabled=false;b.textContent=t("save")}});
  if(onSave)setTimeout(()=>{const f=form.querySelector("input:not([type=file]),select");f&&f.focus()},30);
  return form;
}

async function delClub(id){for(const v of S.visits.filter(v=>v.clubId===id))await db.doc("visits/"+v.id).delete();for(const p of S.plans.filter(p=>p.clubId===id))await db.doc("plans/"+p.id).delete();await db.doc("clubs/"+id).delete()}

async function delStory(id){const s=S.stories.find(x=>x.id===id);for(const i of (s&&s.images)||[])await db.doc("storyImages/"+i).delete();await db.doc("stories/"+id).delete()}
async function delCountry(id){for(const ch of S.churches.filter(c=>c.countryId===id))await delChurch(ch.id);for(const s of S.stories.filter(s=>s.countryId===id))await delStory(s.id);await db.doc("countries/"+id).delete();if(S.countryId===id)S.countryId=null}
async function doDelete(kind,id){
  const ent=kind==="country"?S.countries.find(x=>x.id===id):kind==="church"?S.churches.find(x=>x.id===id):kind==="member"?S.team.find(x=>x.id===id):kind==="story"?S.stories.find(x=>x.id===id):kind==="visit"?S.visits.find(x=>x.id===id):kind==="plan"?S.plans.find(x=>x.id===id):kind==="training"?S.trainings.find(x=>x.id===id):kind==="resource"?S.resources.find(x=>x.id===id):null;
  const lab=ent?(kind==="country"?cname(ent):kind==="story"?ent.title:(kind==="visit"||kind==="plan")?((S.churches.find(c=>c.id===ent.churchId)||{}).name||"")+" · "+ent.date:(kind==="training"||kind==="resource")?ent.title:ent.name):"";
  const lcid=ent?(kind==="country"?ent.id:ent.countryId):"";
  try{if(kind==="country")await delCountry(id);else if(kind==="church")await delChurch(id);else if(kind==="visit")await db.doc("visits/"+id).delete();else if(kind==="member")await db.doc("team/"+id).delete();else if(kind==="story")await delStory(id);else if(kind==="plan")await db.doc("plans/"+id).delete();else if(kind==="training")await db.doc("trainings/"+id).delete();else if(kind==="resource")await db.doc("resources/"+id).delete();logAct("del",kind,lab,lcid);toast(t("deleted"));render()}
  catch(e){console.error(e);toast(e&&e.code==="invalid_argument"?t("noPerm"):t("failed"))}
}

async function save(filename,data){
  const blob=data instanceof Blob?data:new Blob([data]);
  try{
    const touch=matchMedia("(pointer:coarse)").matches;
    if(touch&&navigator.canShare&&window.File){const f=new File([blob],filename,{type:blob.type||"application/octet-stream"});
      if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:filename});toast(t("dlDone"));return}catch(e){if(e&&e.name==="AbortError"){toast(t("dlDecl"));return}}}}
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(t("dlDone"));
  }catch(e){console.error(e);toast(t("failed"))}
}

   ${sec("rAch",r.ach,"#0057a8")}${sec("rChal",r.chal,"#e0262d")}${sec("rPray",r.pray,"#3f9b2c")}${sec("rNeeds",r.needs,"#b07f00")}${sec("rNext",r.next,"#0057a8")}
   <div class="avoid" style="margin-top:20px;background:#0057a8;color:#fff;border-radius:16px;padding:16px 22px;text-align:center"><div style="font-family:var(--f-display);font-size:16px;line-height:1.7">«${t("verse").replace(/<\/?b>/g,"")}»</div><div style="color:#f7b500;font-weight:700;font-size:12px;margin-top:4px">${esc(t("verseRef"))}</div></div></div>

const imgSize=u=>new Promise(r=>{const i=new Image();i.onload=()=>r({w:i.naturalWidth||800,h:i.naturalHeight||600});i.onerror=()=>r({w:800,h:600});i.src=u});
/* DOCX_BUILDER_START */
function buildStoryDocx(JSZip,o){
  // o: {rtl, logoB64 (png, white), eyebrow, title, meta, paragraphs[], images:[{b64,w,h,ext}], verse, verseRef}
  const rtl=!!o.rtl;
  const xe=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const run=(text,f={})=>`<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${f.b?"<w:b/><w:bCs/>":""}${f.color?`<w:color w:val="${f.color}"/>`:""}${f.sz?`<w:sz w:val="${f.sz}"/><w:szCs w:val="${f.sz}"/>`:""}${rtl?"<w:rtl/>":""}</w:rPr><w:t xml:space="preserve">${xe(text)}</w:t></w:r>`;
  const para=(runs,f={})=>`<w:p><w:pPr>${f.shd?`<w:shd w:val="clear" w:color="auto" w:fill="${f.shd}"/>`:""}${rtl?"<w:bidi/>":""}<w:spacing w:before="${f.before||0}" w:after="${f.after??120}" w:line="${f.line||276}" w:lineRule="auto"/>${f.jc?`<w:jc w:val="${f.jc}"/>`:""}${f.ind?`<w:ind w:left="${f.ind}" w:right="${f.ind}"/>`:""}</w:pPr>${runs}</w:p>`;
  let pid=1;
  const pic=(rid,wpx,hpx)=>{const cx=Math.round(wpx*9525),cy=Math.round(hpx*9525),id=pid++;
    return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="57150" distR="57150"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Picture ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="img${id}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`};
  const noB=`<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>`;
  const W=9638;
  const band=(fill,inner)=>`<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/>${rtl?"<w:bidiVisual/>":""}${noB}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="240" w:type="dxa"/><w:left w:w="240" w:type="dxa"/><w:bottom w:w="160" w:type="dxa"/><w:right w:w="240" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${W}"/></w:tblGrid><w:tr><w:tc><w:tcPr><w:tcW w:w="${W}" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="${fill}"/></w:tcPr>${inner}</w:tc></w:tr></w:tbl>`;
  const cols=["0057A8","E0262D","3F9B2C","F7B500"];const cw=[2410,2409,2410,2409];
  const stripe=`<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/>${noB}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="0" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${cw.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid><w:tr><w:trPr><w:trHeight w:val="110" w:hRule="exact"/></w:trPr>${cols.map((c,i)=>`<w:tc><w:tcPr><w:tcW w:w="${cw[i]}" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="${c}"/></w:tcPr><w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr></w:p></w:tc>`).join("")}</w:tr></w:tbl>`;
  const rels=[`<Relationship Id="rIdLogo" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.png"/>`];
  const zip=new JSZip();
  zip.file("word/media/logo.png",o.logoB64,{base64:true});
  let body="";
  body+=band("0057A8",para(pic("rIdLogo",190,35),{jc:"center",after:60})+para(run(o.bandText||"",{color:"FFFFFF",sz:22,b:true}),{jc:"center",after:0}));
  body+=stripe;
  body+=para(run(o.eyebrow,{color:"E0262D",b:true,sz:22}),{before:320,after:60});
  body+=para(run(o.title,{color:"0057A8",b:true,sz:44}),{after:80,line:300});
  if(o.meta)body+=para(run(o.meta,{color:"6B7280",sz:20}),{after:240});
  if(o.images&&o.images.length){
    const maxW=o.images.length>1?300:600,maxH=o.images.length>1?260:380;
    let runs="";
    o.images.forEach((im,i)=>{const rid="rIdImg"+i,name=`img${i}.${im.ext}`;zip.file("word/media/"+name,im.b64,{base64:true});
      rels.push(`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${name}"/>`);
      const sc=Math.min(maxW/im.w,maxH/im.h);runs+=pic(rid,Math.round(im.w*sc),Math.round(im.h*sc));});
    body+=para(runs,{jc:"center",after:240});
  }
  (o.paragraphs||[]).forEach(p=>{body+=para(run(p,{sz:24,color:"1F2937"}),{after:160,line:360})});
  body+=para("",{after:120});
  body+=para(run(o.verse,{color:"0057A8",sz:22,b:true}),{jc:"center",shd:"E8F0FB",before:120,after:0,line:320,ind:200});
  body+=para(run(o.verseRef,{color:"0057A8",sz:18}),{jc:"center",shd:"E8F0FB",after:200,ind:200});
  body+=stripe;
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body}<w:sectPr>${rtl?"<w:bidi/>":""}<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="1134" w:bottom="850" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join("")}</Relationships>`);
  zip.file("word/document.xml",doc);
  return zip.generateAsync({type:o.type||"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

async function exportStoryDocx(id){
  toast(t("preparing"));
  try{await loadScript(LIB.zip)}catch(e){toast(t("failed"));return}
  const x=await storyData(id);if(!x)return;const {s,country,imgs}=x;
  const images=[];for(const u of imgs){const sz=await imgSize(u);images.push({b64:u.split(",")[1],w:sz.w,h:sz.h,ext:/^data:image\/png/.test(u)?"png":"jpeg"})}
  try{
    const blob=await buildStoryDocx(JSZip,{rtl:S.lang==="ar",logoB64:LOGO_W.split(",")[1],bandText:t("story")+" — "+t("title"),eyebrow:t("story")+" · "+country,title:s.title,meta:fmtDate(s.date)+(s.author?" · "+s.author:""),
      paragraphs:String(s.text||"").split(/\n+/).filter(Boolean),images,verse:"«"+t("verse").replace(/<\/?b>/g,"")+"»",verseRef:t("verseRef")});
    await save(`${safeName(s.title)}.docx`,blob);
  }catch(e){console.error(e);toast(t("failed"))}
}

/* ---------- data (Firebase) ---------- */
let dataUnsubs=[],userUnsub=null;
function stopData(){dataUnsubs.forEach(f=>{try{f()}catch(e){}});dataUnsubs=[];S.subscribed=false;S.loaded={}}
function subscribe(name){
  const done=()=>{S.loaded[name]=true;if(COLS.every(k=>S.loaded[k]))S.loaded.ready=true;render()};
  dataUnsubs.push(db.collection(name).onSnapshot(snap=>{S[name]=snap.docs.map(x=>Object.assign({id:x.id},x.data()));done()},err=>{console.error(name,err);done()}));
}
function startData(){
  if(S.me&&!ls.get("aw_seen_"+S.me.id))ls.set("aw_seen_"+S.me.id,String(Date.now()));
  stopData();S.subscribed=true;S.dataRole=role();
  COLS.forEach(subscribe);
  dataUnsubs.push(db.doc("config/programs").onSnapshot(s=>{S.extraPrograms=(s.exists&&Array.isArray(s.data().extra))?s.data().extra:[];render()},()=>{}));
  if(isAdmin()){dataUnsubs.push(db.collection("users").onSnapshot(s=>{S.users=s.docs.map(x=>Object.assign({id:x.id},x.data()));render()},e=>console.error(e)));
    dataUnsubs.push(db.collection("logs").orderBy("at","desc").limit(100).onSnapshot(s=>{S.logs=s.docs.map(x=>Object.assign({id:x.id},x.data()));if(S.tab==="users")render()},e=>console.error(e)));
    dataUnsubs.push(db.doc("config/backup").onSnapshot(s=>{S.backup=s.exists?s.data():null;render()},()=>{}));}
  else S.users=[];
}
async function signIn(){
  if(!auth)return;S.authErr="";
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await auth.signInWithPopup(p)}
  catch(e){
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(e.code)){try{await auth.signInWithRedirect(p)}catch(e2){S.authErr=e2.code||"error";render()}}
    else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){S.authErr=e.code||"error";render()}
  }
}
function boot(){
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){S.auth="nocfg";render();return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth.getRedirectResult().catch(e=>{S.authErr=e.code||"error";render()});
  auth.onAuthStateChanged(async u=>{
    if(userUnsub){userUnsub();userUnsub=null}stopData();S.me=null;S.users=[];
    if(!u){S.auth="out";render();return}
    S.auth="loading";render();
    const ref=db.doc("users/"+u.uid);
    const owner=OWNER_EMAILS.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase());
    try{
      const snap=await ref.get();
      if(!snap.exists)await ref.set({name:u.displayName||"",email:u.email||"",photo:u.photoURL||"",role:owner?"admin":"pending",countryId:"",createdAt:Date.now(),lastSeen:Date.now()});
      else{const up={name:u.displayName||snap.data().name||"",photo:u.photoURL||"",lastSeen:Date.now()};if(owner&&snap.data().role!=="admin")up.role="admin";await ref.update(up).catch(()=>{})}
    }catch(e){console.error(e);S.auth="error";S.authErr=e.code||"";render();return}
    userUnsub=ref.onSnapshot(sn=>{
      const d=sn.data()||{};S.me=Object.assign({id:u.uid,email:u.email},d);const r=d.role;
      const ok=r==="admin"||r==="leader"||r==="viewer";
      S.auth=ok?"in":r==="disabled"?"disabled":"pending";
      if(ok){if(!S.subscribed||S.dataRole!==r||S.dataCountry!==d.countryId){S.dataCountry=d.countryId;startData()}}else stopData();
      render();
    },e=>{console.error(e);S.auth="error";S.authErr=e.code||"";render()});
  });
}
boot();
})();
